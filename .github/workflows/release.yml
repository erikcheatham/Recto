# Release recto-core to PyPI on tag push.
#
# Triggered by pushing a tag matching `v*` (e.g. `v1.1.0`). The
# workflow builds sdist + wheel, validates metadata via twine check,
# and uploads to PyPI via OIDC trusted publishing (no PYPI_TOKEN
# secret needed in the repo).
#
# Pre-release tags (containing `-rc`, `-beta`, `-alpha`, OR matching
# `v0.*`) auto-route to TestPyPI instead of production PyPI. This
# lets release engineers dry-run on TestPyPI before the production
# cutover.
#
# Operator setup: see RELEASING.md → "Prerequisites (one-time setup)"
# for the PyPI trusted-publisher configuration steps. The workflow
# requires:
#   1. A PyPI trusted publisher registered for this repo + workflow
#      pointing at the `pypi-release` environment (production)
#   2. A TestPyPI trusted publisher pointing at the `pypi-test`
#      environment (pre-release dry-run)
#   3. Both environments configured in repo settings with optional
#      manual-approval gates (recommended for the production one)

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # required for PyPI trusted publishing (OIDC)

jobs:
  classify-tag:
    name: Classify tag (production vs pre-release)
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - id: classify
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -rc|-beta|-alpha ]] || [[ "$TAG" =~ ^v0\. ]]; then
            echo "Tag ${TAG} classified as PRE-RELEASE (routing to TestPyPI)"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} classified as PRODUCTION RELEASE (routing to PyPI)"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: classify-tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so setuptools_scm could be wired later

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata
        run: |
          python -m twine check dist/*
          ls -la dist/

      - name: Verify version matches tag
        run: |
          WHEEL=$(ls dist/recto_core-*.whl | head -1)
          WHEEL_VERSION=$(echo "$WHEEL" | sed -E 's|.*recto_core-([0-9][^-]*)-.*|\1|')
          TAG_VERSION="${{ needs.classify-tag.outputs.version }}"
          if [ "$WHEEL_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: wheel version ${WHEEL_VERSION} does not match tag version ${TAG_VERSION}"
            echo "Update pyproject.toml's version field to match the tag, OR re-tag with the correct version."
            exit 1
          fi
          echo "Version match confirmed: ${WHEEL_VERSION}"

      - name: Verify capability manifest shipped in wheel
        run: |
          python -m pip install --target=/tmp/wheel-inspect dist/recto_core-*.whl
          if [ ! -f /tmp/wheel-inspect/recto/capability/manifest_v1.json ]; then
            echo "ERROR: recto/capability/manifest_v1.json missing from wheel"
            echo "Check [tool.setuptools.package-data] block in pyproject.toml"
            exit 1
          fi
          echo "Capability manifest shipped correctly in wheel"

      - name: Upload artifacts for publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [classify-tag, build]
    if: needs.classify-tag.outputs.is_prerelease == 'true'
    environment:
      name: pypi-test
      url: https://test.pypi.org/project/recto-core/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI via trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [classify-tag, build]
    if: needs.classify-tag.outputs.is_prerelease == 'false'
    environment:
      name: pypi-release
      url: https://pypi.org/project/recto-core/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        # OIDC trusted publishing — no PYPI_TOKEN needed; the
        # id-token: write permission at the top of this file is
        # what grants the OIDC assertion that PyPI verifies against
        # the trusted-publisher config.

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [classify-tag, build, publish-pypi]
    if: needs.classify-tag.outputs.is_prerelease == 'false'
    permissions:
      contents: write  # required to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "recto-core ${{ needs.classify-tag.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

# R8 keep rules for the Release Android build (AndroidLinkTool=r8; docs/backlog.md, Play's DEX optimization item).
# .NET for Android adds its own rules for the app's Java callable wrappers; the AARs below ship consumer rules of their
# own. These lines keep what a binding reaches by reflection or by name at runtime, where an R8 failure shows up only on
# a device. ML Kit barcode scanning and CameraX are not referenced by Recto.csproj today (their PackageReferences are
# commented out), so they carry no rules here; add theirs with the reference.

# Firebase Cloud Messaging: the push wake (RectoFirebaseMessagingService subclasses FirebaseMessagingService).
-keep class com.google.firebase.messaging.** { *; }
-keep class com.google.firebase.iid.** { *; }
-keep class com.google.firebase.installations.** { *; }
-keep class com.google.firebase.components.** { *; }
-keep class * extends com.google.firebase.components.ComponentRegistrar { *; }
-dontwarn com.google.firebase.**

# AndroidX Biometric: the prompt that gates every identity-key signature.
-keep class androidx.biometric.** { *; }

# Android Keystore / StrongBox: reached through the platform framework, never shrunk, kept explicit for the reader.
-keep class android.security.keystore.** { *; }
